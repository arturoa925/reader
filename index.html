<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, viewport-fit=cover">
<title>Reader</title>
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Reader">
<meta name="theme-color" content="#000000">
<link rel="apple-touch-icon" href="icon-180.png">
<script src="https://cdnjs.cloudflare.com/ajax/libs/highlight.js/11.9.0/highlight.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/highlight.js/11.9.0/languages/swift.min.js"></script>
<style>
  :root {
    color-scheme: dark;
    --bg: #000000;
    --grouped-bg: #000000;
    --cell-bg: #1c1c1e;
    --cell-bg-2: #2c2c2e;
    --separator: rgba(84,84,88,0.65);
    --label: #ffffff;
    --label-2: rgba(235,235,245,0.6);
    --label-3: rgba(235,235,245,0.3);
    --blue: #0a84ff;
    --green: #30d158;
    --red: #ff453a;
    --purple: #bf5af2;
    --orange: #ff9f0a;
    --yellow: #ffd60a;
    --teal: #64d2ff;
    --pink: #ff375f;
    --gray5: #2c2c2e;
    --gray6: #1c1c1e;
    --code-size: 15px;
    --ui-font: -apple-system, BlinkMacSystemFont, "SF Pro Text", "SF Pro Display", "Helvetica Neue", sans-serif;
    --mono-font: ui-monospace, "SF Mono", Menlo, Consolas, monospace;
    --safe-top: env(safe-area-inset-top, 0px);
    --safe-bottom: env(safe-area-inset-bottom, 0px);
  }
  * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
  html, body {
    margin: 0; padding: 0; height: 100%;
    background: var(--grouped-bg); color: var(--label);
    font-family: var(--ui-font);
    -webkit-font-smoothing: antialiased;
    overscroll-behavior-y: none;
  }
  body { display: flex; flex-direction: column; }
  ::selection { background: rgba(10,132,255,0.35); }
  button, input { font-family: var(--ui-font); }

  /* ---------- Nav bar ---------- */
  header {
    position: sticky; top: 0; z-index: 30;
    padding-top: var(--safe-top);
    background: rgba(0,0,0,0.78);
    backdrop-filter: blur(20px) saturate(180%);
    -webkit-backdrop-filter: blur(20px) saturate(180%);
    border-bottom: 0.5px solid var(--separator);
  }
  .navRow { display: flex; align-items: center; min-height: 44px; padding: 0 6px; }
  .navSide { display: flex; align-items: center; gap: 2px; min-width: 44px; flex: none; }
  .navSide.trailing { justify-content: flex-end; }
  .navTitle {
    flex: 1; text-align: center; font-size: 17px; font-weight: 600;
    letter-spacing: -0.01em; overflow: hidden; text-overflow: ellipsis; white-space: nowrap;
    padding: 0 4px; font-family: var(--mono-font);
  }
  .largeTitleWrap { padding: 2px 16px 10px; }
  .largeTitle { font-size: 30px; font-weight: 750; letter-spacing: -0.021em; line-height: 1.1; font-family: var(--ui-font); }
  .largeSubtitle { font-size: 14px; color: var(--label-2); margin-top: 3px; }

  .navBtn {
    background: none; border: none; color: var(--blue); font-size: 17px;
    padding: 8px 10px; cursor: pointer; display: flex; align-items: center; justify-content: center; gap: 4px;
    border-radius: 8px; line-height: 1; min-width: 44px; min-height: 44px; touch-action: manipulation;
  }
  .navBtn:active { opacity: 0.4; }
  .navBtn:disabled { opacity: 0.25; }
  .navBtn svg { display: block; }
  .navBtn.label { font-size: 15px; font-weight: 400; min-width: auto; }

  .iosSwitch {
    width: 51px; height: 31px; border-radius: 16px; background: var(--gray5);
    border: none; position: relative; cursor: pointer; flex: none; padding: 0;
    transition: background 0.2s;
  }
  .iosSwitch.on { background: var(--green); }
  .iosSwitch .knob {
    position: absolute; top: 2px; left: 2px; width: 27px; height: 27px; border-radius: 50%;
    background: #fff; box-shadow: 0 3px 8px rgba(0,0,0,0.35);
    transition: transform 0.2s cubic-bezier(.4,0,.2,1);
  }
  .iosSwitch.on .knob { transform: translateX(20px); }

  .iosStepper { display: flex; align-items: center; background: var(--gray5); border-radius: 8px; overflow: hidden; }
  .iosStepper button { background: none; border: none; color: var(--blue); width: 34px; height: 32px; font-size: 17px; cursor: pointer; font-family: var(--ui-font); }
  .iosStepper button:active { background: rgba(255,255,255,0.08); }
  .iosStepper .div { width: 0.5px; background: var(--separator); height: 20px; }

  .subToolbar {
    display: flex; align-items: center; justify-content: space-between; gap: 10px;
    padding: 8px 14px; background: rgba(28,28,30,0.9);
    backdrop-filter: blur(20px); -webkit-backdrop-filter: blur(20px);
    border-bottom: 0.5px solid var(--separator);
  }
  .subToolbar .grp { display: flex; align-items: center; gap: 10px; }
  .subToolbar .swLabel { font-size: 13px; color: var(--label-2); }
  .breadcrumbLine {
    padding: 6px 14px; font-size: 12px; color: var(--label-2); font-family: var(--mono-font);
    overflow-x: auto; white-space: nowrap; scrollbar-width: none;
    border-bottom: 0.5px solid var(--separator); background: rgba(28,28,30,0.6);
  }
  .breadcrumbLine::-webkit-scrollbar { display: none; }
  .breadcrumbLine span.seg { cursor: pointer; }
  .breadcrumbLine span.seg:active { color: var(--blue); }
  .breadcrumbLine span.sep { color: var(--label-3); margin: 0 3px; }

  /* ---------- Workspace layout ---------- */
  .workspace { flex: 1; display: flex; min-height: 0; }
  .sidebarScrim {
    position: fixed; inset: 0; background: rgba(0,0,0,0); z-index: 24; pointer-events: none; transition: background 0.2s;
  }
  .sidebarScrim.show { background: rgba(0,0,0,0.5); pointer-events: auto; }
  .sidebar {
    width: 280px; flex: none; background: var(--cell-bg); overflow-y: auto;
    border-right: 0.5px solid var(--separator); -webkit-overflow-scrolling: touch;
    overscroll-behavior: contain;
  }
  @media (max-width: 899px) {
    .sidebar {
      position: fixed; top: 0; bottom: 0; left: 0; z-index: 25;
      width: 84vw; max-width: 320px; padding-top: var(--safe-top);
      transform: translateX(-100%); transition: transform 0.25s cubic-bezier(.32,.72,0,1);
    }
    .sidebar.open { transform: translateX(0); }
  }
  .sidebarHeader { padding: 12px 14px 8px; border-bottom: 0.5px solid var(--separator); }
  .sidebarTitle { display: flex; align-items: center; justify-content: space-between; }
  .sidebarTitle .name { font-size: 15px; font-weight: 700; font-family: var(--mono-font); }
  .repoChips { display: flex; gap: 6px; overflow-x: auto; margin-top: 8px; scrollbar-width: none; }
  .repoChips::-webkit-scrollbar { display: none; }
  .repoChips .chip {
    flex: none; background: var(--gray6); border: 0.5px solid var(--separator); border-radius: 12px;
    padding: 4px 10px; font-size: 11.5px; font-family: var(--mono-font); color: var(--label-2); cursor: pointer; white-space: nowrap;
  }
  .repoChips .chip.active { color: #fff; background: var(--blue); border-color: var(--blue); }

  .treeNode { user-select: none; }
  .treeRow {
    display: flex; align-items: center; gap: 6px; padding: 9.5px 10px; cursor: pointer;
    font-size: 13.5px; border-radius: 6px; margin: 1px 6px; touch-action: manipulation;
  }
  .treeRow:active { background: rgba(255,255,255,0.08); }
  .treeRow.activeFile { background: rgba(10,132,255,0.22); }
  .treeRow .disclosure { width: 14px; height: 14px; flex: none; display: flex; align-items: center; justify-content: center; color: var(--label-3); transition: transform 0.15s; }
  .treeRow .disclosure.expanded { transform: rotate(90deg); }
  .treeRow .glyph { width: 16px; height: 16px; flex: none; display: flex; align-items: center; justify-content: center; color: var(--blue); }
  .treeRow.file .glyph { color: var(--label-3); }
  .treeRow .name { font-family: var(--mono-font); font-size: 13.5px; color: var(--label); overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .treeChildren { overflow: hidden; }

  .content { flex: 1; min-width: 0; display: flex; flex-direction: column; overflow: hidden; }
  .contentScroll { flex: 1; overflow-y: auto; -webkit-overflow-scrolling: touch; overscroll-behavior: contain; }

  .setupWrap { max-width: 480px; margin: 0 auto; padding: 8px 0 40px; }
  .groupLabel { font-size: 13px; color: var(--label-2); padding: 18px 16px 6px; text-transform: uppercase; letter-spacing: 0.02em; }
  .group { background: var(--cell-bg); border-radius: 12px; margin: 0 16px; overflow: hidden; }
  .cell { padding: 12px 14px; border-bottom: 0.5px solid var(--separator); }
  .cell:last-child { border-bottom: none; }
  .cell input { width: 100%; background: none; border: none; outline: none; color: var(--label); font-size: 16px; font-family: var(--ui-font); }
  .cell input::placeholder { color: var(--label-3); }
  .cellHint { font-size: 12px; color: var(--label-2); padding: 8px 16px 0; line-height: 1.5; }
  .fillBtn {
    display: block; width: calc(100% - 32px); margin: 18px 16px 0;
    background: var(--blue); color: #fff; border: none; border-radius: 12px;
    padding: 13px 16px; font-size: 17px; font-weight: 600; cursor: pointer; text-align: center;
  }
  .fillBtn:active { opacity: 0.7; }
  .plainCell { display: flex; align-items: center; justify-content: space-between; padding: 13px 14px; cursor: pointer; }
  .plainCell:active { background: rgba(255,255,255,0.06); }
  .plainCell .t { font-size: 16px; color: var(--label); font-family: var(--mono-font); }
  .plainCell .chev { color: var(--label-3); display: flex; }

  .listGroup { background: var(--cell-bg); border-radius: 12px; margin: 8px 16px 20px; overflow: hidden; }
  .row { display: flex; align-items: center; gap: 10px; padding: 11px 14px; border-bottom: 0.5px solid var(--separator); cursor: pointer; }
  .row:last-child { border-bottom: none; }
  .row:active { background: rgba(255,255,255,0.06); }
  .row .glyph { width: 22px; height: 22px; flex: none; display: flex; align-items: center; justify-content: center; color: var(--blue); }
  .row .name { font-family: var(--mono-font); font-size: 15px; flex: 1; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; color: var(--label); }
  .row .meta { font-size: 12.5px; color: var(--label-3); flex: none; }
  .row .chev { color: var(--label-3); flex: none; display: flex; }

  .emptyState { padding: 60px 24px; text-align: center; color: var(--label-2); font-size: 15px; line-height: 1.6; display: flex; flex-direction: column; align-items: center; gap: 14px; }
  .emptyState svg { color: var(--label-3); }
  .spinner { padding: 50px; text-align: center; color: var(--label-2); font-size: 14px; }
  .errorBox { margin: 16px; padding: 13px 15px; background: rgba(255,69,58,0.12); border-radius: 12px; color: #ff8a80; font-size: 14px; line-height: 1.55; }

  .codeScroll { overflow-x: auto; background: #000; }
  .codeScroll.wrap pre code { white-space: pre-wrap; word-break: break-word; }
  pre { margin: 0; padding: 10px 0 90px; font-family: var(--mono-font); font-size: var(--code-size); line-height: 1.6; }
  code.hljs { background: none !important; padding: 0 !important; color: var(--label); }
  .lineRow { display: flex; user-select: text; }
  .lineRow.selected { background: rgba(10,132,255,0.16); }
  .lineRow.flash { animation: flashLine 1.1s ease-out; }
  @keyframes flashLine {
    0% { background: rgba(255,214,10,0.35); }
    100% { background: transparent; }
  }
  .lineNum { flex: none; width: 42px; text-align: right; padding-right: 12px; color: var(--label-3); user-select: none; -webkit-user-select: none; font-size: calc(var(--code-size) - 2px); }
  .lineContent { flex: 1; padding-right: 16px; white-space: pre; }
  .codeScroll.wrap .lineContent { white-space: pre-wrap; word-break: break-word; }

  .hljs-keyword, .hljs-built_in, .hljs-name { color: #ff7ab2; }
  .hljs-string, .hljs-regexp { color: #ff8170; }
  .hljs-comment, .hljs-quote { color: #7f8c98; font-style: italic; }
  .hljs-number, .hljs-literal { color: #d9c97c; }
  .hljs-title, .hljs-title.class_, .hljs-title.function_, .hljs-type { color: #6bdfff; }
  .hljs-attr, .hljs-attribute, .hljs-property { color: #acf2e4; }
  .hljs-variable, .hljs-template-variable { color: #ffffff; }
  .hljs-symbol, .hljs-bullet, .hljs-meta { color: #d9c97c; }
  .hljs-tag { color: #7f8c98; }
  .hljs-deletion { color: #ff453a; }
  .hljs-addition { color: #30d158; }

  .sheetScrim { position: fixed; inset: 0; background: rgba(0,0,0,0); z-index: 40; pointer-events: none; transition: background 0.2s; }
  .sheetScrim.show { background: rgba(0,0,0,0.4); pointer-events: auto; }
  .sheet {
    position: fixed; left: 0; right: 0; bottom: 0; z-index: 41; max-height: 78vh; display: flex; flex-direction: column;
    background: rgba(28,28,30,0.97);
    backdrop-filter: blur(24px); -webkit-backdrop-filter: blur(24px);
    border-radius: 16px 16px 0 0;
    padding: 10px 0 calc(10px + var(--safe-bottom));
    transform: translateY(100%); transition: transform 0.25s cubic-bezier(.32,.72,0,1);
  }
  .sheet.show { transform: translateY(0); }
  .sheetHandle { width: 36px; height: 5px; border-radius: 3px; background: var(--gray5); margin: 0 auto 12px; flex: none; }
  .sheetInner { padding: 0 16px; overflow-y: auto; -webkit-overflow-scrolling: touch; overscroll-behavior: contain; }
  .sheetLabel { font-size: 13px; color: var(--label-2); font-family: var(--mono-font); text-align: center; margin-bottom: 12px; }
  .sheetBtn { width: 100%; padding: 13px; border-radius: 12px; border: none; font-size: 17px; font-weight: 600; cursor: pointer; margin-bottom: 8px; font-family: var(--ui-font); }
  .sheetBtn.primary { background: var(--blue); color: #fff; }
  .sheetBtn.secondary { background: var(--gray5); color: var(--label); }
  .sheetBtn.plain { background: none; color: var(--red); font-weight: 500; margin-bottom: 0; }
  .sheetBtn:active { opacity: 0.7; }
  .sheetTitle { font-size: 17px; font-weight: 700; margin-bottom: 10px; }
  .sheetSearchField {
    background: var(--gray6); border-radius: 10px; padding: 9px 10px; display: flex; align-items: center; gap: 6px; margin-bottom: 10px;
  }
  .sheetSearchField svg { flex: none; color: var(--label-3); }
  .sheetSearchField input { flex: 1; background: none; border: none; outline: none; color: var(--label); font-size: 16px; font-family: var(--ui-font); }
  .sheetSearchField input::placeholder { color: var(--label-3); }
  .sheetSectionLabel { font-size: 12px; color: var(--label-2); text-transform: uppercase; letter-spacing: 0.02em; padding: 10px 2px 4px; }
  .symbolRow { display: flex; align-items: center; gap: 10px; padding: 10.5px 4px; cursor: pointer; border-radius: 8px; touch-action: manipulation; }
  .symbolRow:active { background: rgba(255,255,255,0.08); }
  .symbolRow .badge {
    width: 22px; height: 22px; border-radius: 6px; flex: none; display: flex; align-items: center; justify-content: center;
    font-size: 12px; font-weight: 700; color: #fff; font-family: var(--mono-font);
  }
  .symbolRow .name { font-family: var(--mono-font); font-size: 14.5px; flex: 1; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .symbolRow .lineNo { font-size: 12px; color: var(--label-3); flex: none; }
  .symbolRow .path { font-size: 11.5px; color: var(--label-3); display: block; }
  .searchHint { font-size: 12.5px; color: var(--label-2); padding: 6px 2px 2px; line-height: 1.5; }

  .toast {
    position: fixed; left: 50%; bottom: calc(28px + var(--safe-bottom)); transform: translateX(-50%) scale(0.95);
    background: rgba(28,28,30,0.92); backdrop-filter: blur(14px); -webkit-backdrop-filter: blur(14px);
    color: #fff; padding: 10px 18px; border-radius: 14px; font-size: 14px; font-weight: 500; z-index: 50; opacity: 0; pointer-events: none;
    transition: opacity 0.2s, transform 0.2s;
  }
  .toast.show { opacity: 1; transform: translateX(-50%) scale(1); }

  footer { padding: 14px; text-align: center; font-size: 11.5px; color: var(--label-3); }
</style>
</head>
<body>

<header id="headerEl"></header>
<main id="main"></main>
<div class="sheetScrim" id="sheetScrim"></div>
<div class="sheet" id="sheet"></div>
<div class="toast" id="toast"></div>

<script>
/* ============================================================
   Reader — a single-file, read-only GitHub browser styled after
   iOS system UI, with a persistent file tree (VS Code / Xcode
   navigator style) and a per-file symbol outline + repo-wide
   definition search in place of true jump-to-definition (which
   needs a real language server this file can't provide).
   ============================================================ */

const DEFAULT_OWNER = 'arturoa925';

const ICONS = {
  chevronLeft: '<path d="M14.5 5.5l-6 6.5 6 6.5" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" fill="none"/>',
  chevronRight: '<path d="M8.5 5.5l6 6.5-6 6.5" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" fill="none"/>',
  gear: '<circle cx="12" cy="12" r="3.2" stroke="currentColor" stroke-width="1.8" fill="none"/><path d="M12 3.5v2.3M12 18.2v2.3M20.5 12h-2.3M5.8 12H3.5M17.8 6.2l-1.6 1.6M7.8 16.2l-1.6 1.6M17.8 17.8l-1.6-1.6M7.8 7.8L6.2 6.2" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"/>',
  search: '<circle cx="10.5" cy="10.5" r="6" stroke="currentColor" stroke-width="1.8" fill="none"/><path d="M15 15l5 5" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"/>',
  folder: '<path d="M3.5 6.5a1 1 0 0 1 1-1h4.4l1.6 2h9a1 1 0 0 1 1 1v9.5a1 1 0 0 1-1 1h-15a1 1 0 0 1-1-1z" stroke="currentColor" stroke-width="1.6" fill="none" stroke-linejoin="round"/>',
  doc: '<path d="M6.5 3.5h7l4 4v13a1 1 0 0 1-1 1h-10a1 1 0 0 1-1-1v-16a1 1 0 0 1 1-1z" stroke="currentColor" stroke-width="1.6" fill="none" stroke-linejoin="round"/><path d="M13.2 3.5v4h4" stroke="currentColor" stroke-width="1.6" fill="none" stroke-linejoin="round"/>',
  copy: '<rect x="8" y="8" width="12" height="13" rx="2.2" stroke="currentColor" stroke-width="1.7" fill="none"/><path d="M16 8V5.2A1.2 1.2 0 0 0 14.8 4H5.2A1.2 1.2 0 0 0 4 5.2v11.6A1.2 1.2 0 0 0 5.2 18H8" stroke="currentColor" stroke-width="1.7" fill="none" stroke-linejoin="round"/>',
  sidebar: '<rect x="3.5" y="4.5" width="17" height="15" rx="2.2" stroke="currentColor" stroke-width="1.7" fill="none"/><path d="M9.5 4.5v15" stroke="currentColor" stroke-width="1.7"/>',
  braces: '<path d="M9 4c-2 0-2.6 1-2.6 2.6v2.6C6.4 10.6 5.6 11 4.5 11v2c1.1 0 1.9.4 1.9 1.8v2.6c0 1.6.6 2.6 2.6 2.6" stroke="currentColor" stroke-width="1.6" fill="none" stroke-linecap="round"/><path d="M15 4c2 0 2.6 1 2.6 2.6v2.6c0 1.4.8 1.8 1.9 1.8v2c-1.1 0-1.9.4-1.9 1.8v2.6c0 1.6-.6 2.6-2.6 2.6" stroke="currentColor" stroke-width="1.6" fill="none" stroke-linecap="round"/>',
  folderOpen: '<path d="M3.5 8.5V6.5a1 1 0 0 1 1-1h4.4l1.6 2h6a1 1 0 0 1 1 1v0" stroke="currentColor" stroke-width="1.6" fill="none" stroke-linejoin="round"/><path d="M3 9.8a1 1 0 0 1 1-.8h15.6a1 1 0 0 1 .97 1.24l-1.5 6a1 1 0 0 1-.97.76H4.5a1 1 0 0 1-1-1z" stroke="currentColor" stroke-width="1.6" fill="none" stroke-linejoin="round"/>'
};
function icon(name, size) {
  size = size || 20;
  return `<svg width="${size}" height="${size}" viewBox="0 0 24 24">${ICONS[name] || ''}</svg>`;
}

const KIND_META = {
  func:      { letter: 'f', color: '#0a84ff' },
  init:      { letter: 'i', color: '#ff375f' },
  class:     { letter: 'C', color: '#bf5af2' },
  struct:    { letter: 'S', color: '#64d2ff' },
  enum:      { letter: 'E', color: '#ff9f0a' },
  protocol:  { letter: 'P', color: '#ffd60a' },
  extension: { letter: 'x', color: '#98989d' },
  interface: { letter: 'I', color: '#bf5af2' },
  type:      { letter: 'T', color: '#64d2ff' }
};

const SYMBOL_PATTERNS = {
  swift: [
    { re: /\bfunc\s+([A-Za-z_][A-Za-z0-9_]*)/, kind: 'func' },
    { re: /\bclass\s+([A-Za-z_][A-Za-z0-9_]*)/, kind: 'class' },
    { re: /\bstruct\s+([A-Za-z_][A-Za-z0-9_]*)/, kind: 'struct' },
    { re: /\benum\s+([A-Za-z_][A-Za-z0-9_]*)/, kind: 'enum' },
    { re: /\bprotocol\s+([A-Za-z_][A-Za-z0-9_]*)/, kind: 'protocol' },
    { re: /\bextension\s+([A-Za-z_][A-Za-z0-9_.]*)/, kind: 'extension' },
    { re: /\binit\s*[?!]?\s*\(/, kind: 'init', nameOverride: 'init' }
  ],
  javascript: [
    { re: /\bfunction\s+([A-Za-z_$][\w$]*)/, kind: 'func' },
    { re: /\bclass\s+([A-Za-z_$][\w$]*)/, kind: 'class' },
    { re: /\bconst\s+([A-Za-z_$][\w$]*)\s*=\s*(?:async\s*)?\(?[^=]*\)?\s*=>/, kind: 'func' },
    { re: /\bconst\s+([A-Za-z_$][\w$]*)\s*=\s*(?:async\s*)?function/, kind: 'func' }
  ],
  typescript: [
    { re: /\binterface\s+([A-Za-z_$][\w$]*)/, kind: 'interface' },
    { re: /\btype\s+([A-Za-z_$][\w$]*)\s*=/, kind: 'type' },
    { re: /\bfunction\s+([A-Za-z_$][\w$]*)/, kind: 'func' },
    { re: /\bclass\s+([A-Za-z_$][\w$]*)/, kind: 'class' },
    { re: /\bconst\s+([A-Za-z_$][\w$]*)\s*=\s*(?:async\s*)?\(?[^=]*\)?\s*=>/, kind: 'func' }
  ],
  python: [
    { re: /\bdef\s+([A-Za-z_]\w*)/, kind: 'func' },
    { re: /\bclass\s+([A-Za-z_]\w*)/, kind: 'class' }
  ],
  go: [
    { re: /\bfunc\s+(?:\([^)]*\)\s*)?([A-Za-z_]\w*)/, kind: 'func' },
    { re: /\btype\s+([A-Za-z_]\w*)\s+struct/, kind: 'struct' }
  ],
  kotlin: [
    { re: /\bfun\s+([A-Za-z_]\w*)/, kind: 'func' },
    { re: /\bclass\s+([A-Za-z_]\w*)/, kind: 'class' }
  ],
  java: [
    { re: /\bclass\s+([A-Za-z_]\w*)/, kind: 'class' },
    { re: /\binterface\s+([A-Za-z_]\w*)/, kind: 'interface' }
  ]
};
const FALLBACK_PATTERNS = [
  { re: /\bfunction\s+([A-Za-z_]\w*)/, kind: 'func' },
  { re: /\bdef\s+([A-Za-z_]\w*)/, kind: 'func' },
  { re: /\bfunc\s+([A-Za-z_]\w*)/, kind: 'func' },
  { re: /\bclass\s+([A-Za-z_]\w*)/, kind: 'class' },
  { re: /\bstruct\s+([A-Za-z_]\w*)/, kind: 'struct' },
  { re: /\benum\s+([A-Za-z_]\w*)/, kind: 'enum' },
  { re: /\binterface\s+([A-Za-z_]\w*)/, kind: 'interface' }
];

function extractSymbols(lines, lang) {
  const patterns = SYMBOL_PATTERNS[lang] || FALLBACK_PATTERNS;
  const out = [];
  lines.forEach((line, idx) => {
    for (const p of patterns) {
      const m = line.match(p.re);
      if (m) { out.push({ name: p.nameOverride || m[1], kind: p.kind, line: idx }); break; }
    }
  });
  return out;
}

const state = {
  token: '', owner: '', repo: '', branch: '',
  view: 'setup', // setup | repos | workspace
  tree: null, nestedTree: null,
  expandedDirs: new Set(),
  currentPath: '', fileLines: [],
  selection: { start: null, end: null },
  recents: [], filterQuery: '', wrap: true,
  sidebarOpen: false,
  symbolIndex: {}, // path -> symbols[]
  lastOwnerInput: ''
};

const $ = (sel) => document.querySelector(sel);
const headerEl = $('#headerEl');
const mainEl = $('#main');

function toast(msg) {
  const t = $('#toast');
  t.textContent = msg;
  t.classList.add('show');
  clearTimeout(toast._t);
  toast._t = setTimeout(() => t.classList.remove('show'), 1600);
}

function ghHeaders(extra) {
  const h = Object.assign({ 'Accept': 'application/vnd.github+json' }, extra || {});
  if (state.token) h['Authorization'] = 'Bearer ' + state.token;
  return h;
}

async function gh(path, extraHeaders) {
  const res = await fetch('https://api.github.com' + path, { headers: ghHeaders(extraHeaders) });
  if (!res.ok) {
    if (res.status === 403) throw new Error('Rate limited or blocked. Add a token to raise your limit.');
    if (res.status === 404) throw new Error('Not found. Check the owner/repo name.');
    if (res.status === 422) throw new Error('Search index not ready for this repo yet.');
    throw new Error('GitHub API error (' + res.status + ')');
  }
  return res.json();
}

function b64DecodeUnicode(str) {
  return decodeURIComponent(
    atob(str).split('').map(c => '%' + ('00' + c.charCodeAt(0).toString(16)).slice(-2)).join('')
  );
}

/* ---------------- Nested tree ---------------- */

function buildNestedTree(blobs) {
  const root = { type: 'dir', name: '', path: '', children: {} };
  blobs.forEach(b => {
    const parts = b.path.split('/');
    let node = root;
    let acc = '';
    parts.forEach((part, i) => {
      acc = acc ? acc + '/' + part : part;
      const isFile = i === parts.length - 1;
      if (isFile) {
        node.children[part] = { type: 'file', name: part, path: acc, sha: b.sha };
      } else {
        if (!node.children[part]) node.children[part] = { type: 'dir', name: part, path: acc, children: {} };
        node = node.children[part];
      }
    });
  });
  return root;
}

function sortedChildren(node) {
  return Object.values(node.children).sort((a, b) =>
    a.type === b.type ? a.name.localeCompare(b.name) : (a.type === 'dir' ? -1 : 1)
  );
}

function ancestorPaths(path) {
  const parts = path.split('/');
  const out = [];
  let acc = '';
  for (let i = 0; i < parts.length - 1; i++) {
    acc = acc ? acc + '/' + parts[i] : parts[i];
    out.push(acc);
  }
  return out;
}

function buildInlineSearch(placeholder, value, onInput) {
  const wrap = document.createElement('div');
  wrap.style.cssText = 'padding:0 16px 10px;';
  const field = document.createElement('div');
  field.className = 'sheetSearchField';
  field.style.marginBottom = '0';
  field.innerHTML = icon('search', 17);
  const input = document.createElement('input');
  input.placeholder = placeholder;
  input.value = value || '';
  input.oninput = (e) => onInput(e.target.value);
  field.appendChild(input);
  wrap.appendChild(field);
  return wrap;
}

function buildBreadcrumb() {
  const bar = document.createElement('div');
  bar.className = 'breadcrumbLine';
  const parts = state.currentPath.split('/');
  const segs = [state.repo, ...parts];
  bar.innerHTML = segs.map((s, i) =>
    (i > 0 ? '<span class="sep">›</span>' : '') + `<span class="seg" data-i="${i}">${s}</span>`
  ).join('');
  bar.querySelectorAll('.seg').forEach(el => {
    el.onclick = () => {
      const i = +el.dataset.i;
      if (i === 0) return; // repo root, nothing to reveal beyond opening sidebar
      const dirPath = parts.slice(0, i).join('/');
      revealInSidebar(dirPath);
      openSidebarMobile();
    };
  });
  return bar;
}

function buildSubToolbar() {
  const bar = document.createElement('div');
  bar.className = 'subToolbar';
  const stepper = document.createElement('div');
  stepper.className = 'iosStepper';
  const minus = document.createElement('button'); minus.textContent = 'A−'; minus.onclick = () => adjustFont(-1);
  const div = document.createElement('div'); div.className = 'div';
  const plus = document.createElement('button'); plus.textContent = 'A+'; plus.onclick = () => adjustFont(1);
  stepper.appendChild(minus); stepper.appendChild(div); stepper.appendChild(plus);
  bar.appendChild(stepper);

  const grp = document.createElement('div');
  grp.className = 'grp';
  const swLabel = document.createElement('span'); swLabel.className = 'swLabel'; swLabel.textContent = 'Wrap';
  const sw = document.createElement('button');
  sw.className = 'iosSwitch' + (state.wrap ? ' on' : '');
  sw.innerHTML = '<span class="knob"></span>';
  sw.onclick = () => { state.wrap = !state.wrap; render(); };
  grp.appendChild(swLabel); grp.appendChild(sw);
  bar.appendChild(grp);
  return bar;
}

let fontSize = 15;
function adjustFont(delta) {
  fontSize = Math.min(22, Math.max(11, fontSize + delta));
  document.documentElement.style.setProperty('--code-size', fontSize + 'px');
}

function toggleSidebar() {
  state.sidebarOpen = !state.sidebarOpen;
  const sb = $('#sidebarEl'), scrim = $('#sidebarScrim');
  if (sb) sb.classList.toggle('open', state.sidebarOpen);
  if (scrim) scrim.classList.toggle('show', state.sidebarOpen);
}
function openSidebarMobile() {
  state.sidebarOpen = true;
  const sb = $('#sidebarEl'), scrim = $('#sidebarScrim');
  if (sb) sb.classList.add('open');
  if (scrim) scrim.classList.add('show');
}
function closeSidebarMobile() {
  state.sidebarOpen = false;
  const sb = $('#sidebarEl'), scrim = $('#sidebarScrim');
  if (sb) sb.classList.remove('open');
  if (scrim) scrim.classList.remove('show');
}

/* ---------------- Main views ---------------- */

function renderMain() {
  mainEl.innerHTML = '';
  if (state.view === 'setup') return renderSetup();
  if (state.view === 'repos') return renderRepos();
  if (state.view === 'workspace') return renderWorkspace();
}

function renderSetup() {
  const wrap = document.createElement('div');
  wrap.className = 'setupWrap';
  wrap.innerHTML = `
    <div class="groupLabel">Account</div>
    <div class="group"><div class="cell"><input id="ownerInput" placeholder="GitHub username or org" autocapitalize="off" autocorrect="off" /></div></div>
    <div class="groupLabel">Token</div>
    <div class="group"><div class="cell"><input id="tokenInput" type="password" placeholder="Personal access token — optional" autocapitalize="off" autocorrect="off" /></div></div>
    <div class="cellHint">Kept in this tab's memory only — never saved, never sent anywhere but api.github.com. Needed for private repos and for repo-wide symbol search.</div>
    <button class="fillBtn" id="loadReposBtn">Load repos</button>
    <div class="groupLabel">Or open directly</div>
    <div class="group"><div class="cell"><input id="directRepoInput" placeholder="owner/repo" autocapitalize="off" autocorrect="off" /></div></div>
    <button class="fillBtn" id="openDirectBtn" style="background:var(--gray5);">Open repo</button>
    <div id="recentsWrap"></div>
  `;
  mainEl.appendChild(wrap);

  $('#tokenInput').value = state.token;
  $('#ownerInput').value = state.owner && !state.repo ? state.owner : (state.lastOwnerInput || DEFAULT_OWNER);
  $('#directRepoInput').value = DEFAULT_OWNER + '/';

  $('#openDirectBtn').onclick = () => {
    state.token = $('#tokenInput').value.trim();
    const val = $('#directRepoInput').value.trim();
    const [owner, repo] = val.split('/');
    if (!owner || !repo) return toast('Enter it as owner/repo');
    openRepo(owner, repo);
  };
  $('#loadReposBtn').onclick = () => {
    state.token = $('#tokenInput').value.trim();
    const owner = $('#ownerInput').value.trim();
    if (!owner) return toast('Enter a username or org');
    state.lastOwnerInput = owner;
    loadRepos(owner);
  };

  if (state.recents.length) {
    const rWrap = $('#recentsWrap');
    rWrap.innerHTML = '<div class="groupLabel">Recent</div>';
    const group = document.createElement('div');
    group.className = 'group';
    state.recents.forEach(r => {
      const row = document.createElement('div');
      row.className = 'plainCell';
      row.innerHTML = `<span class="t">${r.owner}/${r.repo}</span><span class="chev">${icon('chevronRight', 16)}</span>`;
      row.onclick = () => { state.token = $('#tokenInput').value.trim(); openRepo(r.owner, r.repo); };
      group.appendChild(row);
    });
    rWrap.appendChild(group);

}

async function loadRepos(owner) {
  mainEl.innerHTML = '<div class="spinner">Loading repos…</div>';
  try {
    let repos;
    try { repos = await gh(`/users/${owner}/repos?per_page=100&sort=updated`); }
    catch (e) { repos = await gh(`/orgs/${owner}/repos?per_page=100&sort=updated`); }
    state.owner = owner; state.repo = ''; state.repos = repos;
    state.view = 'repos'; state.filterQuery = '';
    render();
  } catch (e) {
    mainEl.innerHTML = `<div class="errorBox">${e.message}</div>`;
  }
}

function renderRepos() {
  const q = (state.filterQuery || '').toLowerCase();
  const list = (state.repos || []).filter(r => r.name.toLowerCase().includes(q));
  const wrap = document.createElement('div');
  if (!list.length) {
    wrap.innerHTML = '<div class="emptyState">No repos match.</div>';
  } else {
    const group = document.createElement('div');
    group.className = 'listGroup';
    list.forEach(r => {
      const row = document.createElement('div');
      row.className = 'row';
      row.innerHTML = `<span class="glyph">${icon('folder', 18)}</span><span class="name">${r.name}</span><span class="meta">${r.language || ''}</span><span class="chev">${icon('chevronRight', 15)}</span>`;
      row.onclick = () => openRepo(state.owner, r.name, r.default_branch);
      group.appendChild(row);
    });
    wrap.appendChild(group);
  }
  mainEl.appendChild(wrap);
}

async function openRepo(owner, repo, branch) {
  mainEl.innerHTML = '<div class="spinner">Loading ' + owner + '/' + repo + '…</div>';
  try {
    let b = branch;
    if (!b) { const info = await gh(`/repos/${owner}/${repo}`); b = info.default_branch; }
    const treeRes = await gh(`/repos/${owner}/${repo}/git/trees/${b}?recursive=1`);
    state.owner = owner; state.repo = repo; state.branch = b;
    state.tree = treeRes.tree.filter(t => t.type === 'blob');
    state.nestedTree = buildNestedTree(state.tree);
    state.expandedDirs = new Set();
    state.currentPath = ''; state.fileLines = [];
    state.symbolIndex = {};
    state.view = 'workspace'; state.filterQuery = '';
    state.sidebarOpen = true; // land on the file tree, not an empty pane behind a closed drawer
    if (!state.recents.find(r => r.owner === owner && r.repo === repo)) {
      state.recents.unshift({ owner, repo });
      state.recents = state.recents.slice(0, 6);
    }
    render();
  } catch (e) {
    mainEl.innerHTML = `<div class="errorBox">${e.message}</div>`;
  }
}

function renderWorkspace() {
  const ws = document.createElement('div');
  ws.className = 'workspace';

  const scrim = document.createElement('div');
  scrim.className = 'sidebarScrim' + (state.sidebarOpen ? ' show' : '');
  scrim.id = 'sidebarScrim';
  scrim.onclick = closeSidebarMobile;

  const sidebar = document.createElement('div');
  sidebar.className = 'sidebar' + (state.sidebarOpen ? ' open' : '');
  sidebar.id = 'sidebarEl';

  const sbHeader = document.createElement('div');
  sbHeader.className = 'sidebarHeader';
  sbHeader.innerHTML = `<div class="sidebarTitle"><span class="name">${state.repo}</span><button class="navBtn" id="settingsBtn">${icon('gear', 18)}</button></div>`;
  const chips = document.createElement('div');
  chips.className = 'repoChips';
  state.recents.forEach(r => {
    const chip = document.createElement('span');
    chip.className = 'chip' + (r.owner === state.owner && r.repo === state.repo ? ' active' : '');
    chip.textContent = r.repo;
    chip.onclick = () => { if (!(r.owner === state.owner && r.repo === state.repo)) openRepo(r.owner, r.repo); };
    chips.appendChild(chip);
  });
  if (state.recents.length > 1) sbHeader.appendChild(chips);
  sidebar.appendChild(sbHeader);

  const treeWrap = document.createElement('div');
  treeWrap.style.padding = '6px 0 24px';
  renderTreeChildren(state.nestedTree, treeWrap, 0);
  sidebar.appendChild(treeWrap);

  const content = document.createElement('div');
  content.className = 'content';
  const contentScroll = document.createElement('div');
  contentScroll.className = 'contentScroll';
  contentScroll.id = 'contentScroll';
  if (!state.currentPath) {
    contentScroll.innerHTML = `<div class="emptyState">${icon('doc', 34)}<div>Tap a file in the sidebar to view it.</div></div>`;
  } else {
    renderFileInto(contentScroll);
  }
  content.appendChild(contentScroll);

  ws.appendChild(scrim);
  ws.appendChild(sidebar);
  ws.appendChild(content);
  mainEl.appendChild(ws);

  setTimeout(() => { const b = $('#settingsBtn'); if (b) b.onclick = () => { state.view = 'setup'; render(); }; }, 0);
}

function renderTreeChildren(node, container, depth) {
  sortedChildren(node).forEach(child => {
    const nodeWrap = document.createElement('div');
    nodeWrap.className = 'treeNode';

    const row = document.createElement('div');
    row.className = 'treeRow ' + (child.type === 'dir' ? 'dir' : 'file') + (child.type === 'file' && child.path === state.currentPath ? ' activeFile' : '');
    row.style.paddingLeft = (10 + depth * 16) + 'px';

    if (child.type === 'dir') {
      const expanded = state.expandedDirs.has(child.path);
      row.innerHTML = `<span class="disclosure${expanded ? ' expanded' : ''}">${icon('chevronRight', 12)}</span><span class="glyph">${icon(expanded ? 'folderOpen' : 'folder', 15)}</span><span class="name">${child.name}</span>`;
      row.onclick = () => {
        if (state.expandedDirs.has(child.path)) state.expandedDirs.delete(child.path);
        else state.expandedDirs.add(child.path);
        rerenderSidebarTree();
      };
      nodeWrap.appendChild(row);
      const childrenWrap = document.createElement('div');
      childrenWrap.className = 'treeChildren';
      if (expanded) renderTreeChildren(child, childrenWrap, depth + 1);
      else childrenWrap.style.display = 'none';
      nodeWrap.appendChild(childrenWrap);
    } else {
      row.innerHTML = `<span class="disclosure"></span><span class="glyph">${icon('doc', 14)}</span><span class="name">${child.name}</span>`;
      row.onclick = () => openFile(child.path);
      nodeWrap.appendChild(row);
    }
    container.appendChild(nodeWrap);
  });
}

function rerenderSidebarTree() {
  const sidebar = $('#sidebarEl');
  if (!sidebar) return;
  const treeWrap = sidebar.children[1];
  treeWrap.innerHTML = '';
  renderTreeChildren(state.nestedTree, treeWrap, 0);
}

function revealInSidebar(dirPath) {
  ancestorPaths(dirPath + '/x').forEach(p => state.expandedDirs.add(p));
  state.expandedDirs.add(dirPath);
  rerenderSidebarTree();
}

function langFromPath(path) {
  const ext = path.split('.').pop().toLowerCase();
  const map = {
    swift: 'swift', js: 'javascript', jsx: 'javascript', ts: 'typescript', tsx: 'typescript',
    py: 'python', rb: 'ruby', go: 'go', rs: 'rust', java: 'java', kt: 'kotlin', c: 'c', h: 'c',
    cpp: 'cpp', hpp: 'cpp', cs: 'csharp', m: 'objectivec', mm: 'objectivec', json: 'json',
    yml: 'yaml', yaml: 'yaml', md: 'markdown', html: 'xml', css: 'css', sh: 'bash', sql: 'sql'
  };
  return map[ext] || 'plaintext';
}

async function openFile(path) {
  closeSidebarMobile();
  const cs = $('#contentScroll');
  if (cs) cs.innerHTML = '<div class="spinner">Loading ' + path + '…</div>';
  try {
    const entry = state.tree.find(t => t.path === path);
    if (!entry) throw new Error('File not found in the loaded tree.');
    const blob = await gh(`/repos/${state.owner}/${state.repo}/git/blobs/${entry.sha}`);
    const text = blob.encoding === 'base64' ? b64DecodeUnicode(blob.content.replace(/\n/g, '')) : blob.content;
    state.currentPath = path;
    state.fileLines = text.split('\n');
    state.selection = { start: null, end: null };
    const lang = langFromPath(path);
    const symbols = extractSymbols(state.fileLines, lang);
    state.symbolIndex[path] = symbols;
    ancestorPaths(path).forEach(p => state.expandedDirs.add(p));
    render();
    return true;
  } catch (e) {
    const msg = e.message === 'Failed to fetch'
      ? 'Network request was blocked. Check your connection — if this is a private repo, make sure your token is entered on the setup screen.'
      : e.message;
    if (cs) cs.innerHTML = `<div class="errorBox">${msg}</div>`;
    return false;
  }
}

async function openFileAndFind(path, term) {
  const ok = await openFile(path);
  if (!ok) return;
  const idx = state.fileLines.findIndex(l => l.toLowerCase().includes(term.toLowerCase()));
  if (idx >= 0) setTimeout(() => scrollToLine(idx), 60);
}

function renderFileInto(container) {
  const scrollWrap = document.createElement('div');
  scrollWrap.className = 'codeScroll' + (state.wrap ? ' wrap' : '');
  const pre = document.createElement('pre');
  const lang = langFromPath(state.currentPath);

  state.fileLines.forEach((line, idx) => {
    const lineRow = document.createElement('div');
    lineRow.className = 'lineRow';
    lineRow.dataset.line = idx;
    const num = document.createElement('span');
    num.className = 'lineNum';
    num.textContent = idx + 1;
    const content = document.createElement('span');
    content.className = 'lineContent';
    const codeEl = document.createElement('code');
    codeEl.className = lang;
    codeEl.textContent = line.length ? line : ' ';
    content.appendChild(codeEl);
    lineRow.appendChild(num);
    lineRow.appendChild(content);
    lineRow.onclick = () => toggleLineSelection(idx);
    pre.appendChild(lineRow);
  });

  scrollWrap.appendChild(pre);
  container.appendChild(scrollWrap);

  try { pre.querySelectorAll('code').forEach(el => hljs.highlightElement(el)); } catch (e) {}
  updateSelectionUI();
}

function scrollToLine(idx) {
  const row = document.querySelector('.lineRow[data-line="' + idx + '"]');
  if (!row) return;
  row.scrollIntoView({ block: 'center' });
  row.classList.add('flash');
  setTimeout(() => row.classList.remove('flash'), 1150);
}

function toggleLineSelection(idx) {
  const sel = state.selection;
  if (sel.start === null) sel.start = sel.end = idx;
  else if (idx === sel.start && sel.start === sel.end) sel.start = sel.end = null;
  else { if (idx < sel.start) sel.start = idx; else sel.end = idx; }

  document.querySelectorAll('.lineRow').forEach(r => {
    const i = +r.dataset.line;
    r.classList.toggle('selected', sel.start !== null && i >= sel.start && i <= sel.end);
  });
  updateSelectionUI();
}

function selectedText() {
  const sel = state.selection;
  if (sel.start === null) return '';
  return state.fileLines.slice(sel.start, sel.end + 1).join('\n');
}

function copyText(text, msg) {
  navigator.clipboard.writeText(text).then(() => toast(msg)).catch(() => {
    const ta = document.createElement('textarea');
    ta.value = text;
    document.body.appendChild(ta);
    ta.select();
    document.execCommand('copy');
    document.body.removeChild(ta);
    toast(msg);
  });
}

/* ---------------- Generic bottom sheet ---------------- */

function showSheet(innerHTML) {
  const sheet = $('#sheet');
  sheet.innerHTML = '<div class="sheetHandle"></div><div class="sheetInner">' + innerHTML + '</div>';
  sheet.classList.add('show');
  $('#sheetScrim').classList.add('show');
}
function hideSheet() {
  $('#sheet').classList.remove('show');
  $('#sheetScrim').classList.remove('show');
}
$('#sheetScrim').onclick = () => { hideSheet(); clearSelectionQuiet(); };

function clearSelectionQuiet() {
  if (state.selection.start === null) return;
  state.selection = { start: null, end: null };
  document.querySelectorAll('.lineRow.selected').forEach(r => r.classList.remove('selected'));
}

function updateSelectionUI() {
  const sel = state.selection;
  if (sel.start === null) { hideSheet(); return; }
  const count = sel.end - sel.start + 1;
  const label = count === 1 ? `Line ${sel.start + 1}` : `Lines ${sel.start + 1}–${sel.end + 1} · ${count} lines`;
  showSheet(`
    <div class="sheetLabel">${label}</div>
    <button class="sheetBtn primary" id="btnCopyClaude">Copy for Claude</button>
    <button class="sheetBtn secondary" id="btnCopySel">Copy</button>
    <button class="sheetBtn plain" id="btnClearSel">Clear selection</button>
  `);
  $('#btnClearSel').onclick = () => { clearSelectionQuiet(); hideSheet(); };
  $('#btnCopySel').onclick = () => { const t = selectedText(); if (t) copyText(t, 'Selection copied'); };
  $('#btnCopyClaude').onclick = () => {
    const sel2 = state.selection;
    const text = selectedText();
    if (!text) return;
    const rangeLabel = sel2.start === sel2.end ? `line ${sel2.start + 1}` : `lines ${sel2.start + 1}-${sel2.end + 1}`;
    const prompt = [
      `File: ${state.owner}/${state.repo}/${state.currentPath} (${rangeLabel})`,
      '```' + langFromPath(state.currentPath), text, '```', '', 'Question: '
    ].join('\n');
    copyText(prompt, 'Copied — paste into Claude');
  };
}

/* ---------------- Symbols sheet (Xcode-style jump bar) ---------------- */

function openSymbolsSheet() {
  if (!state.currentPath) return;
  const symbols = state.symbolIndex[state.currentPath] || [];
  let rows;
  if (!symbols.length) {
    rows = '<div class="searchHint">No functions, classes, or types detected in this file.</div>';
  } else {
    rows = symbols.map((s, i) => {
      const meta = KIND_META[s.kind] || { letter: '?', color: '#8e8e93' };
      return `<div class="symbolRow" data-i="${i}">
        <span class="badge" style="background:${meta.color}">${meta.letter}</span>
        <span class="name">${s.name}</span>
        <span class="lineNo">L${s.line + 1}</span>
      </div>`;
    }).join('');
  }
  showSheet(`<div class="sheetTitle">Symbols in ${state.currentPath.split('/').pop()}</div>${rows}`);
  $('#sheet').querySelectorAll('.symbolRow').forEach(el => {
    el.onclick = () => {
      const i = +el.dataset.i;
      hideSheet();
      setTimeout(() => scrollToLine(symbols[i].line), 180);
    };
  });
}

/* ---------------- Search sheet (files + cached symbols + repo-wide) ---------------- */

function openSearchSheet() {
  showSheet(`
    <div class="sheetSearchField">
      ${icon('search', 17)}
      <input id="searchInput" placeholder="Find a file or a function, class, struct…" autocapitalize="off" autocorrect="off" />
    </div>
    <div id="searchResults"></div>
  `);
  const input = $('#searchInput');
  input.focus();
  input.oninput = () => renderSearchResults(input.value.trim());
  renderSearchResults('');
}

function renderSearchResults(q) {
  const box = $('#searchResults');
  if (!box) return;
  if (!q) { box.innerHTML = '<div class="searchHint">Type to search files and any functions/classes from files you\'ve already opened. Use "Search whole repo" below for a broader definition search.</div>'; return; }
  const ql = q.toLowerCase();

  const fileMatches = (state.tree || []).filter(t => t.path.toLowerCase().includes(ql)).slice(0, 12);
  const symbolMatches = [];
  Object.keys(state.symbolIndex).forEach(path => {
    (state.symbolIndex[path] || []).forEach(s => {
      if (s.name.toLowerCase().includes(ql)) symbolMatches.push({ ...s, path });
    });
  });

  let html = '';
  if (symbolMatches.length) {
    html += '<div class="sheetSectionLabel">Symbols (from opened files)</div>';
    symbolMatches.slice(0, 15).forEach((s, i) => {
      const meta = KIND_META[s.kind] || { letter: '?', color: '#8e8e93' };
      html += `<div class="symbolRow" data-kind="sym" data-i="${i}">
        <span class="badge" style="background:${meta.color}">${meta.letter}</span>
        <span style="flex:1;overflow:hidden;">
          <span class="name" style="display:block;">${s.name}</span>
          <span class="path">${s.path}:${s.line + 1}</span>
        </span>
      </div>`;
    });
  }
  if (fileMatches.length) {
    html += '<div class="sheetSectionLabel">Files</div>';
    fileMatches.forEach((t, i) => {
      html += `<div class="symbolRow" data-kind="file" data-i="${i}">
        <span class="badge" style="background:#48484a">${icon('doc', 13)}</span>
        <span class="name">${t.path}</span>
      </div>`;
    });
  }
  if (!symbolMatches.length && !fileMatches.length) {
    html += '<div class="searchHint">No local matches yet.</div>';
  }
  html += `<button class="sheetBtn secondary" id="btnRepoSearch" style="margin-top:12px;">Search whole repo for "${q}"</button>`;
  if (!state.token) html += '<div class="searchHint">Add a token on the setup screen to enable whole-repo search — GitHub\'s code search requires it.</div>';

  box.innerHTML = html;

  box.querySelectorAll('[data-kind="file"]').forEach(el => {
    el.onclick = () => { hideSheet(); openFile(fileMatches[+el.dataset.i].path); };
  });
  box.querySelectorAll('[data-kind="sym"]').forEach(el => {
    el.onclick = () => {
      const s = symbolMatches[+el.dataset.i];
      hideSheet();
      if (s.path === state.currentPath) scrollToLine(s.line);
      else openFileAndFind(s.path, s.name);
    };
  });
  const repoBtn = $('#btnRepoSearch');
  if (repoBtn) repoBtn.onclick = () => runRepoSearch(q);
}

async function runRepoSearch(q) {
  const box = $('#searchResults');
  box.innerHTML += '<div class="searchHint" id="repoSearchStatus">Searching ' + state.owner + '/' + state.repo + '…</div>';
  try {
    const query = encodeURIComponent(q + ' repo:' + state.owner + '/' + state.repo);
    const data = await gh(`/search/code?q=${query}`, { 'Accept': 'application/vnd.github.text-match+json' });
    const status = $('#repoSearchStatus');
    if (status) status.remove();
    const items = (data.items || []).slice(0, 15);
    if (!items.length) {
      box.innerHTML += '<div class="searchHint">No matches found in the repo.</div>';
      return;
    }
    let html = '<div class="sheetSectionLabel">Whole-repo matches</div>';
    items.forEach((item, i) => {
      html += `<div class="symbolRow" data-repo-i="${i}">
        <span class="badge" style="background:#48484a">${icon('doc', 13)}</span>
        <span class="name">${item.path}</span>
      </div>`;
    });
    box.insertAdjacentHTML('beforeend', html);
    box.querySelectorAll('[data-repo-i]').forEach(el => {
      el.onclick = () => { const item = items[+el.dataset.repoI]; hideSheet(); openFileAndFind(item.path, q); };
    });
  } catch (e) {
    const status = $('#repoSearchStatus');
    if (status) status.textContent = e.message;
  }
}

render();
</script>

<footer id="footerEl">reads public and token-authorized repos via the GitHub API · nothing is stored server-side</footer>

</body>
</html>
