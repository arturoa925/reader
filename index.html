<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, viewport-fit=cover">
<title>Reader</title>
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Reader">
<meta name="theme-color" content="#000000">
<link rel="apple-touch-icon" href="icon-180.png">
<script src="https://cdnjs.cloudflare.com/ajax/libs/highlight.js/11.9.0/highlight.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/highlight.js/11.9.0/languages/swift.min.js"></script>
<style>
  :root {
    color-scheme: dark;
    --bg: #000000;
    --grouped-bg: #000000;
    --cell-bg: #1c1c1e;
    --cell-bg-2: #2c2c2e;
    --separator: rgba(84,84,88,0.65);
    --opaque-separator: #38383a;
    --label: #ffffff;
    --label-2: rgba(235,235,245,0.6);
    --label-3: rgba(235,235,245,0.3);
    --blue: #0a84ff;
    --green: #30d158;
    --red: #ff453a;
    --gray5: #2c2c2e;
    --gray6: #1c1c1e;
    --code-size: 15px;
    --ui-font: -apple-system, BlinkMacSystemFont, "SF Pro Text", "SF Pro Display", "Helvetica Neue", sans-serif;
    --mono-font: ui-monospace, "SF Mono", Menlo, Consolas, monospace;
    --safe-top: env(safe-area-inset-top, 0px);
    --safe-bottom: env(safe-area-inset-bottom, 0px);
  }
  * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
  html, body {
    margin: 0; padding: 0; height: 100%;
    background: var(--grouped-bg); color: var(--label);
    font-family: var(--ui-font);
    -webkit-font-smoothing: antialiased;
    overscroll-behavior-y: none;
  }
  body { display: flex; flex-direction: column; }
  ::selection { background: rgba(10,132,255,0.35); }
  button, input { font-family: var(--ui-font); }

  /* ---------- Nav bar ---------- */
  header {
    position: sticky; top: 0; z-index: 30;
    padding-top: var(--safe-top);
    background: rgba(0,0,0,0.78);
    backdrop-filter: blur(20px) saturate(180%);
    -webkit-backdrop-filter: blur(20px) saturate(180%);
    border-bottom: 0.5px solid var(--separator);
  }
  .navRow {
    display: flex; align-items: center; min-height: 44px; padding: 0 6px;
    position: relative;
  }
  .navSide { display: flex; align-items: center; gap: 2px; min-width: 44px; flex: none; }
  .navSide.trailing { justify-content: flex-end; }
  .navTitle {
    flex: 1; text-align: center; font-size: 17px; font-weight: 600;
    letter-spacing: -0.01em; overflow: hidden; text-overflow: ellipsis; white-space: nowrap;
    padding: 0 4px;
  }
  .largeTitleWrap { padding: 2px 16px 10px; }
  .largeTitle {
    font-size: 30px; font-weight: 750; letter-spacing: -0.021em; line-height: 1.1;
  }
  .largeSubtitle { font-size: 14px; color: var(--label-2); margin-top: 3px; }

  .navBtn {
    background: none; border: none; color: var(--blue); font-size: 17px;
    padding: 8px 10px; cursor: pointer; display: flex; align-items: center; gap: 4px;
    border-radius: 8px; line-height: 1;
  }
  .navBtn:active { opacity: 0.4; }
  .navBtn svg { display: block; }
  .navBtn.label { font-size: 15px; font-weight: 400; }

  /* iOS toggle switch */
  .iosSwitch {
    width: 51px; height: 31px; border-radius: 16px; background: var(--gray5);
    border: none; position: relative; cursor: pointer; flex: none; padding: 0;
    transition: background 0.2s;
  }
  .iosSwitch.on { background: var(--green); }
  .iosSwitch .knob {
    position: absolute; top: 2px; left: 2px; width: 27px; height: 27px; border-radius: 50%;
    background: #fff; box-shadow: 0 3px 8px rgba(0,0,0,0.35);
    transition: transform 0.2s cubic-bezier(.4,0,.2,1);
  }
  .iosSwitch.on .knob { transform: translateX(20px); }

  /* Stepper (font size) */
  .iosStepper {
    display: flex; align-items: center; background: var(--gray5); border-radius: 8px; overflow: hidden;
  }
  .iosStepper button {
    background: none; border: none; color: var(--blue); width: 34px; height: 32px;
    font-size: 17px; cursor: pointer; font-family: var(--ui-font);
  }
  .iosStepper button:active { background: rgba(255,255,255,0.08); }
  .iosStepper .div { width: 0.5px; background: var(--separator); height: 20px; }

  /* Path bar (breadcrumbs) */
  .pathBar {
    display: flex; align-items: center; gap: 2px; overflow-x: auto; scrollbar-width: none;
    padding: 0 12px 8px; -webkit-overflow-scrolling: touch;
  }
  .pathBar::-webkit-scrollbar { display: none; }
  .pathBar button {
    background: none; border: none; color: var(--label-2); font-size: 13px;
    padding: 4px 2px; cursor: pointer; font-family: var(--ui-font); white-space: nowrap; flex: none;
  }
  .pathBar button:last-child { color: var(--label); font-weight: 600; }
  .pathBar .chev { color: var(--label-3); flex: none; display: flex; }

  /* Quick switch chips */
  .quickSwitch {
    display: flex; gap: 6px; overflow-x: auto; scrollbar-width: none;
    padding: 0 12px 10px; -webkit-overflow-scrolling: touch;
  }
  .quickSwitch::-webkit-scrollbar { display: none; }
  .quickSwitch:empty { display: none; }
  .quickSwitch .chip {
    flex: none; background: var(--gray6); border: 0.5px solid var(--separator); border-radius: 14px;
    padding: 5px 12px; font-size: 12.5px; font-family: var(--mono-font); color: var(--label-2);
    cursor: pointer; white-space: nowrap;
  }
  .quickSwitch .chip.active { color: #fff; background: var(--blue); border-color: var(--blue); }
  .quickSwitch .chip:active { opacity: 0.6; }

  /* Search field */
  .searchWrap { padding: 0 16px 10px; }
  .searchField {
    background: var(--gray6); border-radius: 10px; padding: 8px 10px;
    display: flex; align-items: center; gap: 6px;
  }
  .searchField svg { flex: none; color: var(--label-3); }
  .searchField input {
    flex: 1; background: none; border: none; outline: none; color: var(--label);
    font-size: 16px; font-family: var(--ui-font);
  }
  .searchField input::placeholder { color: var(--label-3); }

  /* Secondary toolbar (file view) */
  .subToolbar {
    display: flex; align-items: center; justify-content: space-between; gap: 10px;
    padding: 8px 14px; background: rgba(28,28,30,0.9);
    backdrop-filter: blur(20px); -webkit-backdrop-filter: blur(20px);
    border-bottom: 0.5px solid var(--separator);
  }
  .subToolbar .grp { display: flex; align-items: center; gap: 10px; }
  .subToolbar .swLabel { font-size: 13px; color: var(--label-2); }

  /* ---------- Main ---------- */
  main { flex: 1; overflow-y: auto; -webkit-overflow-scrolling: touch; }

  /* Setup screen */
  .setupWrap { max-width: 480px; margin: 0 auto; padding: 8px 0 40px; }
  .groupLabel {
    font-size: 13px; color: var(--label-2); padding: 18px 16px 6px; text-transform: uppercase;
    letter-spacing: 0.02em;
  }
  .group {
    background: var(--cell-bg); border-radius: 12px; margin: 0 16px; overflow: hidden;
  }
  .cell { padding: 12px 14px; border-bottom: 0.5px solid var(--separator); }
  .cell:last-child { border-bottom: none; }
  .cell input {
    width: 100%; background: none; border: none; outline: none; color: var(--label);
    font-size: 16px; font-family: var(--ui-font);
  }
  .cell input::placeholder { color: var(--label-3); }
  .cellHint { font-size: 12px; color: var(--label-2); padding: 8px 16px 0; line-height: 1.5; }
  .fillBtn {
    display: block; width: calc(100% - 32px); margin: 18px 16px 0;
    background: var(--blue); color: #fff; border: none; border-radius: 12px;
    padding: 13px 16px; font-size: 17px; font-weight: 600; cursor: pointer; text-align: center;
  }
  .fillBtn:active { opacity: 0.7; }
  .fillBtn:disabled { opacity: 0.4; }
  .plainCell {
    display: flex; align-items: center; justify-content: space-between;
    padding: 13px 14px; cursor: pointer;
  }
  .plainCell:active { background: rgba(255,255,255,0.06); }
  .plainCell .t { font-size: 16px; color: var(--label); font-family: var(--mono-font); }
  .plainCell .chev { color: var(--label-3); display: flex; }

  /* Lists */
  .listGroup { background: var(--cell-bg); border-radius: 12px; margin: 8px 16px 20px; overflow: hidden; }
  .row {
    display: flex; align-items: center; gap: 10px;
    padding: 11px 14px; border-bottom: 0.5px solid var(--separator);
    cursor: pointer;
  }
  .row:last-child { border-bottom: none; }
  .row:active { background: rgba(255,255,255,0.06); }
  .row .glyph { width: 22px; height: 22px; flex: none; display: flex; align-items: center; justify-content: center; color: var(--blue); }
  .row.dir .glyph { color: var(--blue); }
  .row.file .glyph { color: var(--label-3); }
  .row .name { font-family: var(--mono-font); font-size: 15px; flex: 1; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; color: var(--label); }
  .row .meta { font-size: 12.5px; color: var(--label-3); flex: none; }
  .row .chev { color: var(--label-3); flex: none; display: flex; }

  .emptyState { padding: 60px 24px; text-align: center; color: var(--label-2); font-size: 15px; line-height: 1.6; }
  .spinner { padding: 50px; text-align: center; color: var(--label-2); font-size: 14px; }
  .errorBox {
    margin: 16px; padding: 13px 15px; background: rgba(255,69,58,0.12);
    border-radius: 12px; color: #ff8a80; font-size: 14px; line-height: 1.55;
  }

  /* Code viewer */
  .codeScroll { overflow-x: auto; background: #000; }
  .codeScroll.wrap pre code { white-space: pre-wrap; word-break: break-word; }
  pre {
    margin: 0; padding: 10px 0 90px;
    font-family: var(--mono-font); font-size: var(--code-size); line-height: 1.6;
  }
  code.hljs { background: none !important; padding: 0 !important; color: var(--label); }
  .lineRow { display: flex; user-select: text; }
  .lineRow.selected { background: rgba(10,132,255,0.16); }
  .lineNum {
    flex: none; width: 42px; text-align: right; padding-right: 12px;
    color: var(--label-3); user-select: none; -webkit-user-select: none;
    font-size: calc(var(--code-size) - 2px);
  }
  .lineContent { flex: 1; padding-right: 16px; white-space: pre; }
  .codeScroll.wrap .lineContent { white-space: pre-wrap; word-break: break-word; }

  /* Xcode-like syntax palette */
  .hljs-keyword, .hljs-built_in, .hljs-name { color: #ff7ab2; }
  .hljs-string, .hljs-regexp { color: #ff8170; }
  .hljs-comment, .hljs-quote { color: #7f8c98; font-style: italic; }
  .hljs-number, .hljs-literal { color: #d9c97c; }
  .hljs-title, .hljs-title.class_, .hljs-title.function_, .hljs-type { color: #6bdfff; }
  .hljs-attr, .hljs-attribute, .hljs-property { color: #acf2e4; }
  .hljs-variable, .hljs-template-variable { color: #ffffff; }
  .hljs-symbol, .hljs-bullet, .hljs-meta { color: #d9c97c; }
  .hljs-tag { color: #7f8c98; }
  .hljs-deletion { color: #ff453a; }
  .hljs-addition { color: #30d158; }

  /* Action sheet (selection bar) */
  .sheetScrim {
    position: fixed; inset: 0; background: rgba(0,0,0,0); z-index: 40;
    pointer-events: none; transition: background 0.2s;
  }
  .sheetScrim.show { background: rgba(0,0,0,0.4); pointer-events: auto; }
  .sheet {
    position: fixed; left: 0; right: 0; bottom: 0; z-index: 41;
    background: rgba(28,28,30,0.96);
    backdrop-filter: blur(24px); -webkit-backdrop-filter: blur(24px);
    border-radius: 16px 16px 0 0;
    padding: 10px 16px calc(16px + var(--safe-bottom));
    transform: translateY(100%); transition: transform 0.25s cubic-bezier(.32,.72,0,1);
  }
  .sheet.show { transform: translateY(0); }
  .sheetHandle { width: 36px; height: 5px; border-radius: 3px; background: var(--gray5); margin: 0 auto 12px; }
  .sheetLabel { font-size: 13px; color: var(--label-2); font-family: var(--mono-font); text-align: center; margin-bottom: 12px; }
  .sheetBtn {
    width: 100%; padding: 13px; border-radius: 12px; border: none; font-size: 17px; font-weight: 600;
    cursor: pointer; margin-bottom: 8px; font-family: var(--ui-font);
  }
  .sheetBtn.primary { background: var(--blue); color: #fff; }
  .sheetBtn.secondary { background: var(--gray5); color: var(--label); }
  .sheetBtn.plain { background: none; color: var(--red); font-weight: 500; margin-bottom: 0; }
  .sheetBtn:active { opacity: 0.7; }

  .toast {
    position: fixed; left: 50%; bottom: calc(28px + var(--safe-bottom)); transform: translateX(-50%) scale(0.95);
    background: rgba(28,28,30,0.92); backdrop-filter: blur(14px); -webkit-backdrop-filter: blur(14px);
    color: #fff; padding: 10px 18px; border-radius: 14px;
    font-size: 14px; font-weight: 500; z-index: 50; opacity: 0; pointer-events: none;
    transition: opacity 0.2s, transform 0.2s;
  }
  .toast.show { opacity: 1; transform: translateX(-50%) scale(1); }

  footer { padding: 14px; text-align: center; font-size: 11.5px; color: var(--label-3); }
</style>
</head>
<body>

<header id="headerEl"></header>
<main id="main"></main>
<div class="sheetScrim" id="sheetScrim"></div>
<div class="sheet" id="sheet">
  <div class="sheetHandle"></div>
  <div class="sheetLabel" id="sheetLabel">0 lines selected</div>
  <button class="sheetBtn primary" id="btnCopyClaude">Copy for Claude</button>
  <button class="sheetBtn secondary" id="btnCopySel">Copy</button>
  <button class="sheetBtn plain" id="btnClearSel">Clear selection</button>
</div>
<div class="toast" id="toast"></div>

<script>
/* ============================================================
   Reader — a small, single-file GitHub code viewer styled after
   iOS system UI. No build step, no framework.
   ============================================================ */

// Your GitHub username — pre-fills the setup screen so you don't retype it every time.
const DEFAULT_OWNER = 'arturoa925';

const ICONS = {
  chevronLeft: '<path d="M14.5 5.5l-6 6.5 6 6.5" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" fill="none"/>',
  chevronRight: '<path d="M8.5 5.5l6 6.5-6 6.5" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round" fill="none"/>',
  gear: '<circle cx="12" cy="12" r="3.2" stroke="currentColor" stroke-width="1.8" fill="none"/><path d="M12 3.5v2.3M12 18.2v2.3M20.5 12h-2.3M5.8 12H3.5M17.8 6.2l-1.6 1.6M7.8 16.2l-1.6 1.6M17.8 17.8l-1.6-1.6M7.8 7.8L6.2 6.2" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"/>',
  search: '<circle cx="10.5" cy="10.5" r="6" stroke="currentColor" stroke-width="1.8" fill="none"/><path d="M15 15l5 5" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"/>',
  folder: '<path d="M3.5 6.5a1 1 0 0 1 1-1h4.4l1.6 2h9a1 1 0 0 1 1 1v9.5a1 1 0 0 1-1 1h-15a1 1 0 0 1-1-1z" stroke="currentColor" stroke-width="1.6" fill="none" stroke-linejoin="round"/>',
  doc: '<path d="M6.5 3.5h7l4 4v13a1 1 0 0 1-1 1h-10a1 1 0 0 1-1-1v-16a1 1 0 0 1 1-1z" stroke="currentColor" stroke-width="1.6" fill="none" stroke-linejoin="round"/><path d="M13.2 3.5v4h4" stroke="currentColor" stroke-width="1.6" fill="none" stroke-linejoin="round"/>',
  copy: '<rect x="8" y="8" width="12" height="13" rx="2.2" stroke="currentColor" stroke-width="1.7" fill="none"/><path d="M16 8V5.2A1.2 1.2 0 0 0 14.8 4H5.2A1.2 1.2 0 0 0 4 5.2v11.6A1.2 1.2 0 0 0 5.2 18H8" stroke="currentColor" stroke-width="1.7" fill="none" stroke-linejoin="round"/>'
};
function icon(name, size) {
  size = size || 20;
  return `<svg width="${size}" height="${size}" viewBox="0 0 24 24">${ICONS[name] || ''}</svg>`;
}

const state = {
  token: '', owner: '', repo: '', branch: '',
  path: [], tree: null, view: 'setup',
  fileLines: [], currentPath: '',
  selection: { start: null, end: null },
  recents: [], filterQuery: '', wrap: false
};

const $ = (sel) => document.querySelector(sel);
const headerEl = $('#headerEl');
const mainEl = $('#main');

function toast(msg) {
  const t = $('#toast');
  t.textContent = msg;
  t.classList.add('show');
  clearTimeout(toast._t);
  toast._t = setTimeout(() => t.classList.remove('show'), 1600);
}

function ghHeaders() {
  const h = { 'Accept': 'application/vnd.github+json' };
  if (state.token) h['Authorization'] = 'Bearer ' + state.token;
  return h;
}

async function gh(path) {
  const res = await fetch('https://api.github.com' + path, { headers: ghHeaders() });
  if (!res.ok) {
    if (res.status === 403) throw new Error('Rate limited or blocked. Add a token to raise your limit.');
    if (res.status === 404) throw new Error('Not found. Check the owner/repo name.');
    throw new Error('GitHub API error (' + res.status + ')');
  }
  return res.json();
}

function b64DecodeUnicode(str) {
  return decodeURIComponent(
    atob(str).split('').map(c => '%' + ('00' + c.charCodeAt(0).toString(16)).slice(-2)).join('')
  );
}

/* ---------------- Header ---------------- */

function render() {
  renderHeader();
  renderMain();
}

function renderHeader() {
  headerEl.innerHTML = '';

  if (state.view === 'setup') {
    headerEl.innerHTML = `
      <div class="largeTitleWrap">
        <div class="largeTitle">Reader</div>
        <div class="largeSubtitle">Browse and copy your code, iOS-style</div>
      </div>`;
    return;
  }

  const nav = document.createElement('div');
  nav.className = 'navRow';

  // leading
  const leading = document.createElement('div');
  leading.className = 'navSide';
  if (state.view !== 'repos' || true) {
    const back = document.createElement('button');
    back.className = 'navBtn';
    back.innerHTML = icon('chevronLeft', 22) + '<span class="label">' + backLabel() + '</span>';
    back.onclick = goBack;
    leading.appendChild(back);
  }
  nav.appendChild(leading);

  const title = document.createElement('div');
  title.className = 'navTitle';
  title.textContent = navTitle();
  nav.appendChild(title);

  const trailing = document.createElement('div');
  trailing.className = 'navSide trailing';
  if (state.view === 'repos' || state.view === 'tree') {
    const gear = document.createElement('button');
    gear.className = 'navBtn';
    gear.innerHTML = icon('gear', 21);
    gear.onclick = () => { state.view = 'setup'; render(); };
    trailing.appendChild(gear);
  }
  if (state.view === 'file') {
    const copyBtn = document.createElement('button');
    copyBtn.className = 'navBtn';
    copyBtn.innerHTML = icon('copy', 20);
    copyBtn.onclick = () => copyText(state.fileLines.join('\n'), 'File copied');
    trailing.appendChild(copyBtn);
  }
  nav.appendChild(trailing);
  headerEl.appendChild(nav);

  if (state.view === 'repos' || state.view === 'tree') {
    headerEl.appendChild(buildPathBar());
    headerEl.appendChild(buildQuickSwitch());
    headerEl.appendChild(buildSearchField(state.view === 'repos' ? 'Filter repos' : 'Go to file'));
  }

  if (state.view === 'file') {
    headerEl.appendChild(buildSubToolbar());
  }
}

function backLabel() {
  if (state.view === 'repos') return 'Reader';
  if (state.view === 'tree') {
    if (state.path.length === 0) return state.owner;
    const parent = state.path.slice(0, -1);
    return parent.length ? parent[parent.length - 1] : state.repo;
  }
  if (state.view === 'file') return state.path.length ? state.path[state.path.length - 1] : state.repo;
  return 'Back';
}

function navTitle() {
  if (state.view === 'repos') return state.owner;
  if (state.view === 'tree') return state.path.length ? state.path[state.path.length - 1] : state.repo;
  if (state.view === 'file') return state.currentPath.split('/').pop();
  return '';
}

function goBack() {
  if (state.view === 'repos') { state.view = 'setup'; render(); return; }
  if (state.view === 'tree') {
    if (state.path.length === 0) { state.view = 'repos'; state.filterQuery = ''; render(); return; }
    state.path = state.path.slice(0, -1);
    render(); return;
  }
  if (state.view === 'file') {
    state.view = 'tree'; render(); return;
  }
}

function buildPathBar() {
  const bar = document.createElement('div');
  bar.className = 'pathBar';
  const home = document.createElement('button');
  home.textContent = state.owner + '/' + state.repo;
  home.onclick = () => { state.path = []; state.view = 'tree'; render(); };
  bar.appendChild(home);
  state.path.forEach((seg, i) => {
    const chev = document.createElement('span');
    chev.className = 'chev';
    chev.innerHTML = icon('chevronRight', 13);
    bar.appendChild(chev);
    const b = document.createElement('button');
    b.textContent = seg;
    b.onclick = () => { state.path = state.path.slice(0, i + 1); state.view = 'tree'; render(); };
    bar.appendChild(b);
  });
  return bar;
}

function buildQuickSwitch() {
  const el = document.createElement('div');
  el.className = 'quickSwitch';
  if (state.recents.length < 2) return el;
  state.recents.forEach(r => {
    const chip = document.createElement('span');
    chip.className = 'chip' + (r.owner === state.owner && r.repo === state.repo ? ' active' : '');
    chip.textContent = r.repo;
    chip.onclick = () => {
      if (r.owner === state.owner && r.repo === state.repo) return;
      openRepo(r.owner, r.repo);
    };
    el.appendChild(chip);
  });
  return el;
}

function buildSearchField(placeholder) {
  const wrap = document.createElement('div');
  wrap.className = 'searchWrap';
  const field = document.createElement('div');
  field.className = 'searchField';
  field.innerHTML = icon('search', 17);
  const input = document.createElement('input');
  input.placeholder = placeholder;
  input.value = state.filterQuery || '';
  input.oninput = (e) => { state.filterQuery = e.target.value; renderMain(); };
  field.appendChild(input);
  wrap.appendChild(field);
  return wrap;
}

function buildSubToolbar() {
  const bar = document.createElement('div');
  bar.className = 'subToolbar';

  const stepper = document.createElement('div');
  stepper.className = 'iosStepper';
  const minus = document.createElement('button');
  minus.textContent = 'A−';
  minus.onclick = () => adjustFont(-1);
  const div = document.createElement('div');
  div.className = 'div';
  const plus = document.createElement('button');
  plus.textContent = 'A+';
  plus.onclick = () => adjustFont(1);
  stepper.appendChild(minus); stepper.appendChild(div); stepper.appendChild(plus);
  bar.appendChild(stepper);

  const grp = document.createElement('div');
  grp.className = 'grp';
  const swLabel = document.createElement('span');
  swLabel.className = 'swLabel';
  swLabel.textContent = 'Wrap';
  const sw = document.createElement('button');
  sw.className = 'iosSwitch' + (state.wrap ? ' on' : '');
  sw.innerHTML = '<span class="knob"></span>';
  sw.onclick = () => { state.wrap = !state.wrap; render(); };
  grp.appendChild(swLabel); grp.appendChild(sw);
  bar.appendChild(grp);

  return bar;
}

let fontSize = 15;
function adjustFont(delta) {
  fontSize = Math.min(22, Math.max(11, fontSize + delta));
  document.documentElement.style.setProperty('--code-size', fontSize + 'px');
}

/* ---------------- Main views ---------------- */

function renderMain() {
  mainEl.innerHTML = '';
  mainEl.scrollTop = 0;
  if (state.view === 'setup') return renderSetup();
  if (state.view === 'repos') return renderRepos();
  if (state.view === 'tree') return renderTree();
  if (state.view === 'file') return renderFile();
}

function renderSetup() {
  const wrap = document.createElement('div');
  wrap.className = 'setupWrap';
  wrap.innerHTML = `
    <div class="groupLabel">Account</div>
    <div class="group">
      <div class="cell"><input id="ownerInput" placeholder="GitHub username or org" autocapitalize="off" autocorrect="off" /></div>
    </div>
    <div class="groupLabel">Token</div>
    <div class="group">
      <div class="cell"><input id="tokenInput" type="password" placeholder="Personal access token — optional" autocapitalize="off" autocorrect="off" /></div>
    </div>
    <div class="cellHint">Kept in this tab's memory only — never saved, never sent anywhere but api.github.com. Needed for private repos. Create one at github.com/settings/tokens with the "repo" scope.</div>
    <button class="fillBtn" id="loadReposBtn">Load repos</button>
    <div class="groupLabel">Or open directly</div>
    <div class="group">
      <div class="cell"><input id="directRepoInput" placeholder="owner/repo" autocapitalize="off" autocorrect="off" /></div>
    </div>
    <button class="fillBtn" id="openDirectBtn" style="background:var(--gray5);">Open repo</button>
    <div id="recentsWrap"></div>
  `;
  mainEl.appendChild(wrap);

  $('#tokenInput').value = state.token;
  $('#ownerInput').value = state.owner && !state.repo ? state.owner : (state.lastOwnerInput || DEFAULT_OWNER);
  $('#directRepoInput').value = DEFAULT_OWNER + '/';

  $('#openDirectBtn').onclick = () => {
    state.token = $('#tokenInput').value.trim();
    const val = $('#directRepoInput').value.trim();
    const [owner, repo] = val.split('/');
    if (!owner || !repo) return toast('Enter it as owner/repo');
    openRepo(owner, repo);
  };
  $('#loadReposBtn').onclick = () => {
    state.token = $('#tokenInput').value.trim();
    const owner = $('#ownerInput').value.trim();
    if (!owner) return toast('Enter a username or org');
    state.lastOwnerInput = owner;
    loadRepos(owner);
  };

  if (state.recents.length) {
    const rWrap = $('#recentsWrap');
    rWrap.innerHTML = '<div class="groupLabel">Recent</div>';
    const group = document.createElement('div');
    group.className = 'group';
    state.recents.forEach(r => {
      const row = document.createElement('div');
      row.className = 'plainCell';
      row.innerHTML = `<span class="t">${r.owner}/${r.repo}</span><span class="chev">${icon('chevronRight', 16)}</span>`;
      row.onclick = () => { state.token = $('#tokenInput').value.trim(); openRepo(r.owner, r.repo); };
      group.appendChild(row);
    });
    rWrap.appendChild(group);
  }
}

async function loadRepos(owner) {
  mainEl.innerHTML = '<div class="spinner">Loading repos…</div>';
  try {
    let repos;
    try { repos = await gh(`/users/${owner}/repos?per_page=100&sort=updated`); }
    catch (e) { repos = await gh(`/orgs/${owner}/repos?per_page=100&sort=updated`); }
    state.owner = owner; state.repo = ''; state.repos = repos;
    state.view = 'repos'; state.filterQuery = '';
    render();
  } catch (e) {
    mainEl.innerHTML = `<div class="errorBox">${e.message}</div>`;
  }
}

function renderRepos() {
  const q = (state.filterQuery || '').toLowerCase();
  const list = (state.repos || []).filter(r => r.name.toLowerCase().includes(q));
  const wrap = document.createElement('div');
  if (!list.length) {
    wrap.innerHTML = '<div class="emptyState">No repos match.</div>';
  } else {
    const group = document.createElement('div');
    group.className = 'listGroup';
    list.forEach(r => {
      const row = document.createElement('div');
      row.className = 'row';
      row.innerHTML = `<span class="glyph">${icon('folder', 18)}</span><span class="name">${r.name}</span><span class="meta">${r.language || ''}</span><span class="chev">${icon('chevronRight', 15)}</span>`;
      row.onclick = () => openRepo(state.owner, r.name, r.default_branch);
      group.appendChild(row);
    });
    wrap.appendChild(group);
  }
  mainEl.appendChild(wrap);
}

async function openRepo(owner, repo, branch) {
  mainEl.innerHTML = '<div class="spinner">Loading ' + owner + '/' + repo + '…</div>';
  try {
    let b = branch;
    if (!b) { const info = await gh(`/repos/${owner}/${repo}`); b = info.default_branch; }
    const treeRes = await gh(`/repos/${owner}/${repo}/git/trees/${b}?recursive=1`);
    state.owner = owner; state.repo = repo; state.branch = b;
    state.tree = treeRes.tree.filter(t => t.type === 'blob');
    state.path = []; state.view = 'tree'; state.filterQuery = '';
    if (!state.recents.find(r => r.owner === owner && r.repo === repo)) {
      state.recents.unshift({ owner, repo });
      state.recents = state.recents.slice(0, 6);
    }
    render();
  } catch (e) {
    mainEl.innerHTML = `<div class="errorBox">${e.message}</div>`;
  }
}

function renderTree() {
  const q = (state.filterQuery || '').toLowerCase();
  const wrap = document.createElement('div');

  if (q) {
    const matches = state.tree.filter(t => t.path.toLowerCase().includes(q)).slice(0, 60);
    wrap.innerHTML = `<div class="groupLabel">${matches.length} match${matches.length === 1 ? '' : 'es'}</div>`;
    const group = document.createElement('div');
    group.className = 'listGroup';
    matches.forEach(t => {
      const row = document.createElement('div');
      row.className = 'row file';
      row.innerHTML = `<span class="glyph">${icon('doc', 17)}</span><span class="name">${t.path}</span><span class="chev">${icon('chevronRight', 15)}</span>`;
      row.onclick = () => openFile(t.path);
      group.appendChild(row);
    });
    wrap.appendChild(group);
    mainEl.appendChild(wrap);
    return;
  }

  const prefix = state.path.length ? state.path.join('/') + '/' : '';
  const seen = new Set();
  const entries = [];
  state.tree.forEach(t => {
    if (!t.path.startsWith(prefix)) return;
    const rest = t.path.slice(prefix.length);
    if (!rest) return;
    const slash = rest.indexOf('/');
    if (slash === -1) entries.push({ type: 'file', name: rest, full: t.path });
    else {
      const dirName = rest.slice(0, slash);
      if (!seen.has(dirName)) { seen.add(dirName); entries.push({ type: 'dir', name: dirName, full: prefix + dirName }); }
    }
  });
  entries.sort((a, b) => (a.type === b.type ? a.name.localeCompare(b.name) : a.type === 'dir' ? -1 : 1));

  if (!entries.length) {
    wrap.innerHTML = '<div class="emptyState">Empty folder.</div>';
  } else {
    const group = document.createElement('div');
    group.className = 'listGroup';
    entries.forEach(e => {
      const row = document.createElement('div');
      row.className = 'row ' + (e.type === 'dir' ? 'dir' : 'file');
      row.innerHTML = `<span class="glyph">${icon(e.type === 'dir' ? 'folder' : 'doc', e.type === 'dir' ? 18 : 17)}</span><span class="name">${e.name}</span><span class="chev">${icon('chevronRight', 15)}</span>`;
      row.onclick = () => {
        if (e.type === 'dir') { state.path = e.full.split('/'); render(); }
        else openFile(e.full);
      };
      group.appendChild(row);
    });
    wrap.appendChild(group);
  }
  mainEl.appendChild(wrap);
}

async function openFile(path) {
  mainEl.innerHTML = '<div class="spinner">Loading ' + path + '…</div>';
  try {
    const entry = state.tree.find(t => t.path === path);
    if (!entry) throw new Error('File not found in the loaded tree.');
    const blob = await gh(`/repos/${state.owner}/${state.repo}/git/blobs/${entry.sha}`);
    const text = blob.encoding === 'base64' ? b64DecodeUnicode(blob.content.replace(/\n/g, '')) : blob.content;
    state.currentPath = path;
    state.fileLines = text.split('\n');
    state.path = path.split('/').slice(0, -1);
    state.selection = { start: null, end: null };
    state.view = 'file';
    render();
  } catch (e) {
    const msg = e.message === 'Failed to fetch'
      ? 'Network request was blocked. Check your connection — if this is a private repo, make sure your token is entered on the setup screen.'
      : e.message;
    mainEl.innerHTML = `<div class="errorBox">${msg}</div>`;
  }
}

function langFromPath(path) {
  const ext = path.split('.').pop().toLowerCase();
  const map = {
    swift: 'swift', js: 'javascript', jsx: 'javascript', ts: 'typescript', tsx: 'typescript',
    py: 'python', rb: 'ruby', go: 'go', rs: 'rust', java: 'java', kt: 'kotlin', c: 'c', h: 'c',
    cpp: 'cpp', hpp: 'cpp', cs: 'csharp', m: 'objectivec', mm: 'objectivec', json: 'json',
    yml: 'yaml', yaml: 'yaml', md: 'markdown', html: 'xml', css: 'css', sh: 'bash', sql: 'sql'
  };
  return map[ext] || 'plaintext';
}

function renderFile() {
  const scrollWrap = document.createElement('div');
  scrollWrap.className = 'codeScroll' + (state.wrap ? ' wrap' : '');
  const pre = document.createElement('pre');
  const lang = langFromPath(state.currentPath);

  state.fileLines.forEach((line, idx) => {
    const lineRow = document.createElement('div');
    lineRow.className = 'lineRow';
    lineRow.dataset.line = idx;
    const num = document.createElement('span');
    num.className = 'lineNum';
    num.textContent = idx + 1;
    const content = document.createElement('span');
    content.className = 'lineContent';
    const codeEl = document.createElement('code');
    codeEl.className = lang;
    codeEl.textContent = line.length ? line : ' ';
    content.appendChild(codeEl);
    lineRow.appendChild(num);
    lineRow.appendChild(content);
    lineRow.onclick = () => toggleLineSelection(idx);
    pre.appendChild(lineRow);
  });

  scrollWrap.appendChild(pre);
  mainEl.appendChild(scrollWrap);

  try { pre.querySelectorAll('code').forEach(el => hljs.highlightElement(el)); } catch (e) {}
  updateSelectionUI();
}

function toggleLineSelection(idx) {
  const sel = state.selection;
  if (sel.start === null) sel.start = sel.end = idx;
  else if (idx === sel.start && sel.start === sel.end) sel.start = sel.end = null;
  else { if (idx < sel.start) sel.start = idx; else sel.end = idx; }

  document.querySelectorAll('.lineRow').forEach(r => {
    const i = +r.dataset.line;
    r.classList.toggle('selected', sel.start !== null && i >= sel.start && i <= sel.end);
  });
  updateSelectionUI();
}

function updateSelectionUI() {
  const sheet = $('#sheet');
  const scrim = $('#sheetScrim');
  const sel = state.selection;
  if (sel.start === null) {
    sheet.classList.remove('show');
    scrim.classList.remove('show');
    return;
  }
  sheet.classList.add('show');
  scrim.classList.add('show');
  const count = sel.end - sel.start + 1;
  $('#sheetLabel').textContent = count === 1 ? `Line ${sel.start + 1}` : `Lines ${sel.start + 1}–${sel.end + 1} · ${count} lines`;
}

function selectedText() {
  const sel = state.selection;
  if (sel.start === null) return '';
  return state.fileLines.slice(sel.start, sel.end + 1).join('\n');
}

function copyText(text, msg) {
  navigator.clipboard.writeText(text).then(() => toast(msg)).catch(() => {
    const ta = document.createElement('textarea');
    ta.value = text;
    document.body.appendChild(ta);
    ta.select();
    document.execCommand('copy');
    document.body.removeChild(ta);
    toast(msg);
  });
}

function clearSelection() {
  state.selection = { start: null, end: null };
  document.querySelectorAll('.lineRow.selected').forEach(r => r.classList.remove('selected'));
  updateSelectionUI();
}

$('#sheetScrim').onclick = clearSelection;
$('#btnClearSel').onclick = clearSelection;

$('#btnCopySel').onclick = () => {
  const text = selectedText();
  if (!text) return;
  copyText(text, 'Selection copied');
};

$('#btnCopyClaude').onclick = () => {
  const sel = state.selection;
  const text = selectedText();
  if (!text) return;
  const rangeLabel = sel.start === sel.end ? `line ${sel.start + 1}` : `lines ${sel.start + 1}-${sel.end + 1}`;
  const prompt = [
    `File: ${state.owner}/${state.repo}/${state.currentPath} (${rangeLabel})`,
    '```' + langFromPath(state.currentPath),
    text,
    '```',
    '',
    'Question: '
  ].join('\n');
  copyText(prompt, 'Copied — paste into Claude');
};

render();
</script>

<footer>reads public and token-authorized repos via the GitHub API · nothing is stored server-side</footer>

</body>
